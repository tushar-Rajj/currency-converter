<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Live Currency Converter – Real-Time FX by Tushar Raj</title>
  <meta name="description" content="Convert currencies with live exchange rates. Fast, accurate, responsive currency converter by Tushar Raj." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#157261" />

  <!-- Open Graph -->
  <meta property="og:title" content="Live Currency Converter" />
  <meta property="og:description" content="Fast, accurate, responsive currency converter with live rates." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://flagsapi.com" />
  <link rel="preconnect" href="https://api.frankfurter.app" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Live Currency Converter",
    "url": "https://tushar-rajj.github.io/currency-converter/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Any"
  }
  </script>
</head>
<body>
  <main class="container" role="main">
    <header>
      <h1>Currency Converter</h1>
      <p>Made by Tushar Raj ❤️</p>
    </header>

    <form id="converter" novalidate aria-busy="false">
      <div class="field">
        <div class="label-row">
          <label for="amount">Enter Amount</label>
        </div>
        <input
          id="amount"
          name="amount"
          type="number"
          step="any"
          inputmode="decimal"
          min="0"
          value="1"
          aria-describedby="amountHelp"
          required
        />
      </div>

      <div class="dropdown">
        <div class="select-box">
          <label for="from">From</label>
          <div class="select-container">
            <img id="flag-from" src="https://flagsapi.com/US/flat/64.png" alt="US flag" />
            <select id="from" name="from" aria-label="From currency"></select>
          </div>
        </div>

        <button class="swap-btn" type="button" id="swap" aria-label="Swap currencies">
          <i class="fa-solid fa-right-left"></i>
        </button>

        <div class="select-box">
          <label for="to">To</label>
          <div class="select-container">
            <img id="flag-to" src="https://flagsapi.com/IN/flat/64.png" alt="IN flag" />
            <select id="to" name="to" aria-label="To currency"></select>
          </div>
        </div>
      </div>

      <div class="msg" id="result" role="status" aria-live="polite">Fetching live rate…</div>
      <div class="meta" id="meta"></div>

      <button class="action" id="convertBtn" type="submit">
        Get Exchange Rate
      </button>
    </form>
  </main>

  <noscript>This app needs JavaScript enabled to fetch live exchange rates.</noscript>
   <script src="logic.js"></script>
</body>
</html>
